name: Update profile stats

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-profile-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Refresh portfolio stats
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repos = await github.paginate(github.rest.repos.listForUser, {
              username: owner,
              type: 'owner',
              per_page: 100,
            });

            const projects = repos.filter(repo => !repo.fork && repo.name !== owner);
            const stars = projects.reduce((total, repo) => total + repo.stargazers_count, 0);
            const forks = projects.reduce((total, repo) => total + repo.forks_count, 0);
            const today = new Date().toISOString().slice(0, 10);
            const stats = [
              '<!-- PROFILE_STATS:START -->',
              '<p align="center">',
              `  <img src="https://img.shields.io/badge/Public%20projects-${projects.length}-003049?style=flat-square&labelColor=6B705C" alt="Public projects" />`,
              `  <img src="https://img.shields.io/badge/Total%20stars-${stars}-003049?style=flat-square&labelColor=6B705C" alt="Total stars" />`,
              `  <img src="https://img.shields.io/badge/Total%20forks-${forks}-003049?style=flat-square&labelColor=6B705C" alt="Total forks" />`,
              '  <br />',
              `  <sub>Portfolio snapshot refreshed ${today} · updated weekly by GitHub Actions</sub>`,
              '</p>',
              '<!-- PROFILE_STATS:END -->',
            ].join('\n');

            const path = 'README.md';
            const readme = fs.readFileSync(path, 'utf8');
            const updated = readme.replace(
              /<!-- PROFILE_STATS:START -->[\s\S]*?<!-- PROFILE_STATS:END -->/,
              stats
            );

            if (updated === readme) {
              core.setFailed('Profile stats markers were not found in README.md');
              return;
            }

            fs.writeFileSync(path, updated);

      - name: Commit refreshed stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "chore: refresh profile stats"
          git push
